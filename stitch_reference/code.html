<body class="bg-background text-on-background antialiased min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">
<div class="sm:mx-auto sm:w-full sm:max-w-md">
<h2 class="mt-6 text-center font-headline-lg text-headline-lg md:font-display-lg md:text-display-lg text-primary">
            Crear nueva cuenta
        </h2>
<p class="mt-2 text-center font-body-md text-body-md text-on-surface-variant">
            Únase a MedSync para gestionar sus citas médicas.
        </p>
</div>
<div class="mt-8 sm:mx-auto sm:w-full sm:max-w-xl">
<div class="bg-surface-container-lowest py-8 px-4 shadow-[0_4px_20px_rgba(0,0,0,0.05)] sm:rounded-xl sm:px-10">
<form action="#" class="space-y-6" method="POST">
<div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
<div>
<label class="block font-label-md text-label-md text-on-surface" for="first-name">
                            Nombres
                        </label>
<div class="mt-1">
<input autocomplete="given-name" class="appearance-none block w-full px-3 py-2 border border-outline-variant rounded-lg shadow-sm placeholder-outline focus:outline-none focus:ring-primary focus:border-primary font-body-md text-body-md bg-surface-bright" id="first-name" name="first-name" required="" type="text"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface" for="last-name">
                            Apellidos
                        </label>
<div class="mt-1">
<input autocomplete="family-name" class="appearance-none block w-full px-3 py-2 border border-outline-variant rounded-lg shadow-sm placeholder-outline focus:outline-none focus:ring-primary focus:border-primary font-body-md text-body-md bg-surface-bright" id="last-name" name="last-name" required="" type="text"/>
</div>
</div>
</div>
<div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
<div>
<label class="block font-label-md text-label-md text-on-surface" for="dob">
                            Fecha de Nacimiento
                        </label>
<div class="mt-1 relative rounded-lg shadow-sm">
<input class="appearance-none block w-full px-3 py-2 border border-outline-variant rounded-lg shadow-sm focus:outline-none focus:ring-primary focus:border-primary font-body-md text-body-md bg-surface-bright text-on-surface" id="dob" name="dob" required="" type="date"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface" for="id-number">
                            Cédula
                        </label>
<div class="mt-1">
<input class="appearance-none block w-full px-3 py-2 border border-outline-variant rounded-lg shadow-sm placeholder-outline focus:outline-none focus:ring-primary focus:border-primary font-body-md text-body-md bg-surface-bright" id="id-number" name="id-number" required="" type="text"/>
</div>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface" for="email">
                        Correo Electrónico
                    </label>
<div class="mt-1 relative rounded-lg shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" style="font-variation-settings: 'FILL' 0;">mail</span>
</div>
<input autocomplete="email" class="appearance-none block w-full pl-10 px-3 py-2 border border-outline-variant rounded-lg shadow-sm placeholder-outline focus:outline-none focus:ring-primary focus:border-primary font-body-md text-body-md bg-surface-bright" id="email" name="email" required="" type="email"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface" for="phone">
                        Teléfono
                    </label>
<div class="mt-1 relative rounded-lg shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" style="font-variation-settings: 'FILL' 0;">call</span>
</div>
<input autocomplete="tel" class="appearance-none block w-full pl-10 px-3 py-2 border border-outline-variant rounded-lg shadow-sm placeholder-outline focus:outline-none focus:ring-primary focus:border-primary font-body-md text-body-md bg-surface-bright" id="phone" name="phone" required="" type="tel"/>
</div>
</div>
<div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="submit">
                        Registrarse
                    </button>
</div>
</form>
<div class="mt-6 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    ¿Ya tienes una cuenta? 
                    <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors font-medium" href="#">
                        Inicia sesión
                    </a>
</p>
</div>
</div>
</div>

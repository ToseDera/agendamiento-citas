<style>
        body { background-color: #F6FBFF; }
        .custom-input {
            border-color: #c3daf5;
        }
        .custom-input:focus {
            border-color: #3A7BD5;
            box-shadow: 0 0 0 2px rgba(142, 197, 255, 0.3);
        }
        .shadow-soft {
            box-shadow: 0 4px 20px rgba(8, 26, 61, 0.05);
        }

<body class="font-body-md text-on-surface antialiased min-h-screen flex flex-col">
<!-- TopNavBar -->
<nav class="bg-secondary dark:bg-on-secondary-fixed text-on-secondary font-headline-md text-headline-md. Body: font-body-md text-body-md. shadow-sm sticky top-0 z-50 flex justify-between items-center px-margin-desktop w-full h-16 w-full">
<div class="flex items-center gap-gutter">
<div class="font-headline-md text-headline-md font-bold text-on-secondary flex items-center h-full">
<img alt="MedSync" class="h-8 w-auto" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCoRETaMXRD3sXH--0h1-rOxR22vbSl9nFJQwhGRMtTU3kDcedh-TkSePAfRHEktk9c4A99O_k7ViANGSNziN8-AzCIUUMDwd8MrbnyAcqlMqfGIJkPSJp3Z2Qwm3jjz7dXYWxpKKhrvaAwK4DuNcO3swrAeioCeuC-ArFU7wDy34KH52wQNMuoiA5dOkeP9sZBVVKa7ssgkdnxciD5jsjy_i_wyBGYhahDyILvfKki4FJPfjMT7lt-w0nvhXpj7U0ur1Y"/>
</div>
<div class="hidden md:flex h-full">
<ul class="flex items-center gap-gutter h-full">
<li class="h-full flex items-center">
<a class="text-on-secondary/80 hover:text-on-secondary hover:bg-primary-container/10 transition-colors duration-200 cursor-pointer active:opacity-80 px-md h-full flex items-center" href="#">Panel</a>
</li>
<li class="h-full flex items-center">
<a class="text-on-secondary/80 hover:text-on-secondary hover:bg-primary-container/10 transition-colors duration-200 cursor-pointer active:opacity-80 px-md h-full flex items-center" href="#">Especialidades</a>
</li>
<li class="h-full flex items-center">
<a class="text-on-secondary border-b-2 border-on-secondary hover:bg-primary-container/10 transition-colors duration-200 cursor-pointer active:opacity-80 px-md h-full flex items-center pt-xs" href="#">Médicos</a>
</li>
</ul>
</div>
</div>
<div class="flex items-center">
<button class="font-label-md text-label-md text-on-secondary/90 hover:text-on-secondary transition-colors cursor-pointer active:opacity-80 flex items-center gap-xs">
                Cerrar sesión
                <span class="material-symbols-outlined text-[18px]">logout</span>
</button>
</div>
</nav>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center py-xl px-margin-mobile md:px-margin-desktop w-full">
<div class="w-full max-w-[560px] flex flex-col gap-lg">
<!-- Header Section -->
<div class="flex flex-col gap-sm">
<!-- Breadcrumb -->
<nav class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-xs">
<a class="hover:text-primary transition-colors" href="#">Panel</a>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
<a class="hover:text-primary transition-colors" href="#">Médicos</a>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
<span class="text-on-surface">Registrar médico</span>
</nav>
<!-- Title -->
<h1 class="font-headline-lg text-headline-lg text-[#1D2D50]">Registrar médico</h1>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-soft p-lg w-full border border-[#D6ECFF]">
<form class="flex flex-col gap-md">
<!-- Row 1: Nombres | Apellidos -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="nombres">Nombres</label>
<input class="w-full h-[56px] rounded-lg custom-input border bg-surface-container-lowest px-sm font-body-md text-body-md focus:outline-none transition-all" id="nombres" placeholder="Ej. Juan Carlos" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="apellidos">Apellidos</label>
<input class="w-full h-[56px] rounded-lg custom-input border bg-surface-container-lowest px-sm font-body-md text-body-md focus:outline-none transition-all" id="apellidos" placeholder="Ej. Pérez Gómez" type="text"/>
</div>
</div>
<!-- Row 2: Fecha de Nacimiento | Tipo de Documento -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="fechaNacimiento">Fecha de Nacimiento</label>
<div class="relative">
<input class="w-full h-[56px] rounded-lg custom-input border bg-surface-container-lowest px-sm font-body-md text-body-md focus:outline-none transition-all appearance-none text-on-surface" id="fechaNacimiento" type="date"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="tipoDocumento">Tipo de Documento</label>
<select class="w-full h-[56px] rounded-lg custom-input border bg-surface-container-lowest px-sm font-body-md text-body-md focus:outline-none transition-all appearance-none text-on-surface" id="tipoDocumento">
<option disabled="" selected="" value="">Seleccione un tipo</option>
<option value="dni">DNI</option>
<option value="pasaporte">Pasaporte</option>
<option value="ce">Carné de Extranjería</option>
</select>
</div>
</div>
<!-- Row 3: Número de Documento | Teléfono -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="numDocumento">Número de Documento</label>
<input class="w-full h-[56px] rounded-lg custom-input border bg-surface-container-lowest px-sm font-body-md text-body-md focus:outline-none transition-all" id="numDocumento" placeholder="Ej. 12345678" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="telefono">Teléfono</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant pointer-events-none">call</span>
<input class="w-full h-[56px] rounded-lg custom-input border bg-surface-container-lowest pl-10 pr-sm font-body-md text-body-md focus:outline-none transition-all" id="telefono" placeholder="Ej. 987654321" type="tel"/>
</div>
</div>
</div>
<!-- Full Row: Correo Electrónico -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Correo Electrónico</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant pointer-events-none">mail</span>
<input class="w-full h-[56px] rounded-lg custom-input border bg-surface-container-lowest pl-10 pr-sm font-body-md text-body-md focus:outline-none transition-all" id="email" placeholder="correo@clinica.com" type="email"/>
</div>
</div>
<!-- Full Row: Especialidad -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="especialidad">Especialidad</label>
<select class="w-full h-[56px] rounded-lg custom-input border bg-surface-container-lowest px-sm font-body-md text-body-md focus:outline-none transition-all appearance-none text-on-surface" id="especialidad">
<option disabled="" selected="" value="">Seleccione una especialidad</option>
<option value="cardiologia">Cardiología</option>
<option value="dermatologia">Dermatología</option>
<option value="gastroenterologia">Gastroenterología</option>
<option value="general">Medicina General</option>
<option value="pediatria">Pediatría</option>
</select>
</div>
<!-- Full Row: Registro profesional (Optional) -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="registro">Registro profesional</label>
<span class="font-label-sm text-label-sm text-outline">Opcional</span>
</div>
<input class="w-full h-[56px] rounded-lg custom-input border bg-surface-container-lowest px-sm font-body-md text-body-md focus:outline-none transition-all" id="registro" placeholder="Ej. CMP 12345" type="text"/>
</div>
<!-- Row 4: Contraseña | Confirmar Contraseña -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Contraseña</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant pointer-events-none">lock</span>
<input class="w-full h-[56px] rounded-lg custom-input border bg-surface-container-lowest pl-10 pr-sm font-body-md text-body-md focus:outline-none transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="confirmPassword">Confirmar Contraseña</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant pointer-events-none">lock</span>
<input class="w-full h-[56px] rounded-lg custom-input border bg-surface-container-lowest pl-10 pr-sm font-body-md text-body-md focus:outline-none transition-all" id="confirmPassword" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<!-- Action Button -->
<div class="mt-sm">
<button class="w-full h-[56px] rounded-lg bg-[#3A7BD5] text-on-primary font-label-md text-label-md hover:bg-primary-container transition-colors shadow-sm flex items-center justify-center gap-xs" type="button">
                            Guardar
                        </button>
</div>
</form>
</div>
</div>
</main>
</body></html>

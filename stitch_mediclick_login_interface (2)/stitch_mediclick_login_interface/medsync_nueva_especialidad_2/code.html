<body class="h-full flex flex-col text-on-surface">
<!-- TopNavBar -->

</a>
<div class="hidden md:flex gap-6 h-full items-center">

<div class="flex items-center">

<span>Cerrar sesión</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">logout</span>
</button>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="flex-1 w-full px-margin-mobile md:px-margin-desktop py-lg flex flex-col items-center">
<div class="w-full max-w-[480px]">
<!-- TopAppBar / Breadcrumb -->
<div class="flex items-center w-full py-base mb-md bg-transparent">
<a class="text-on-surface-variant hover:text-primary font-label-sm text-label-sm flex items-center gap-1" href="#">Panel</a>
<span class="material-symbols-outlined text-outline-variant mx-1 text-[16px]">chevron_right</span>
<a class="text-on-surface-variant hover:text-primary font-label-sm text-label-sm flex items-center gap-1" href="#">Especialidades</a>
<span class="material-symbols-outlined text-outline-variant mx-1 text-[16px]">chevron_right</span>
<span class="text-primary font-semibold font-label-sm text-label-sm">Nueva especialidad</span>
</div>
<!-- Page Title -->
<h1 class="font-headline-lg text-headline-lg text-[#1D2D50] mb-lg text-center md:text-left">Nueva especialidad</h1>
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-lg border border-[#D6ECFF] p-md md:p-lg shadow-[0_4px_20px_rgba(32,47,83,0.05)] w-full">
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- Nombre Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="nombre">Nombre</label>
<input class="h-[56px] w-full bg-white border border-[#D6ECFF] rounded-md px-4 font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-[#3A7BD5] focus:ring-1 focus:ring-[#3A7BD5] focus:outline-none transition-all" id="nombre" name="nombre" placeholder="Ej. Cardiología" type="text"/>
</div>
<!-- Descripción Textarea -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="descripcion">Descripción</label>
<textarea class="w-full bg-white border border-[#D6ECFF] rounded-md p-4 font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-[#3A7BD5] focus:ring-1 focus:ring-[#3A7BD5] focus:outline-none transition-all resize-y" id="descripcion" name="descripcion" placeholder="Breve descripción de la especialidad..." rows="3"></textarea>
</div>
<!-- Duración Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="duracion">Duración de la cita (minutos)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">schedule</span>
<input class="h-[56px] w-full bg-white border border-[#D6ECFF] rounded-md pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-[#3A7BD5] focus:ring-1 focus:ring-[#3A7BD5] focus:outline-none transition-all" id="duracion" min="5" name="duracion" placeholder="30" step="5" type="number"/>
</div>
</div>
<!-- Activa Toggle -->
<div class="flex items-center justify-between pt-sm">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Activa</span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-normal">Disponible para agendar citas</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-outline-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-outline-variant after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#22C55E]"></div>
</label>
</div>
<!-- Actions -->
<div class="flex flex-col gap-sm mt-md pt-md border-t border-[#D6ECFF]">
<button class="h-[56px] w-full bg-[#3A7BD5] hover:bg-[#2e6bbd] text-white rounded-md font-label-md text-label-md font-semibold transition-colors flex items-center justify-center" type="submit">
                            Guardar
                        </button>
<button class="h-[56px] w-full bg-transparent hover:bg-surface-container-low text-on-surface-variant rounded-md font-label-md text-label-md transition-colors flex items-center justify-center" type="button">
                            Cancelar
                        </button>
</div>
</form>
</div>
</div>

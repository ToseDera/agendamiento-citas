{% if estado == 'cancelada' %}
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-[#ffebee] text-[#c0392b] w-fit">
<span class="w-1.5 h-1.5 rounded-full bg-[#c0392b]"></span>
Cancelada
</span>
{% elif estado == 'atendida' %}
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-[#e8f5e9] text-[#1a7f5a] w-fit">
<span class="w-1.5 h-1.5 rounded-full bg-[#1a7f5a]"></span>
Atendida
</span>
{% elif estado == 'no atendida' %}
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-[#ffeedd] text-[#8a5000] w-fit">
<span class="w-1.5 h-1.5 rounded-full bg-[#8a5000]"></span>
No atendida
</span>
{% else %}
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-[#D6ECFF] text-[#236296] w-fit">
<span class="w-1.5 h-1.5 rounded-full bg-[#236296]"></span>
Confirmada
</span>
{% endif %}

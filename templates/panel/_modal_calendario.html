<!-- Modal de detalle del calendario. Payload serializado inline vía
     json_script (decisión 13): solo eventos que ya pasaron por
     obtener_eventos_calendario, ya acotados por rol — no hay endpoint que
     pedir. Las acciones son <a href> a vistas existentes que revalidan
     (decisión 12): el calendario nunca escribe por su cuenta. -->
<div id="modal-backdrop" class="fixed inset-0 bg-[#081a3d]/50 z-50 hidden opacity-0" style="transition: opacity .2s ease;" aria-hidden="true"></div>
<div id="modal-card" class="fixed inset-x-4 bottom-4 md:inset-auto md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 md:w-[440px] bg-white rounded-xl shadow-elevated border border-[#D6ECFF] z-50 hidden opacity-0 scale-95 p-md md:p-lg flex flex-col gap-md" style="transition: transform .2s ease, opacity .2s ease;" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
<div class="flex items-start justify-between gap-sm">
<div>
<span id="modal-tipo-badge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium mb-2"></span>
<h3 id="modal-titulo" class="font-bold text-lg text-[#1D2D50]"></h3>
</div>
<button id="modal-cerrar" type="button" aria-label="Cerrar" class="p-1.5 rounded-lg hover:bg-[#F6FBFF] text-outline transition-colors shrink-0">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div id="modal-cuerpo" class="flex flex-col gap-3 text-sm"></div>
<div id="modal-acciones" class="flex flex-col gap-2 pt-2 border-t border-[#D6ECFF]"></div>
</div>

<script>
(function () {
  'use strict';

  const datosEl = document.getElementById('calendario-eventos-data');
  if (!datosEl) return;
  const eventos = JSON.parse(datosEl.textContent);

  function badgeEstado(evento) {
    if (evento.tipo === 'disponibilidad') return { texto: 'Disponible', clase: 'bg-[#e9edff] text-[#236296]' };
    if (evento.tipo === 'bloqueo') return { texto: evento.dia_completo ? 'Día no disponible' : 'Bloqueo', clase: 'bg-[#727783] text-white' };
    if (evento.estado === 'atendida') return { texto: 'Atendida', clase: 'bg-[#e8f5e9] text-[#1a7f5a]' };
    if (evento.estado === 'no atendida') return { texto: 'No atendida', clase: 'bg-[#ffeedd] text-[#8a5000]' };
    return { texto: 'Confirmada', clase: 'bg-[#D6ECFF] text-[#236296]' };
  }

  function campoDetalle(icono, texto) {
    return '<div class="flex items-center gap-2 text-[#1D2D50]"><span class="material-symbols-outlined text-[18px] text-[#3A7BD5]">' + icono + '</span><span>' + texto + '</span></div>';
  }

  function abrirDetalle(evento) {
    const badge = badgeEstado(evento);
    document.getElementById('modal-tipo-badge').className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium mb-2 ' + badge.clase;
    document.getElementById('modal-tipo-badge').textContent = badge.texto;
    document.getElementById('modal-titulo').textContent = evento.titulo;

    const filas = [];
    filas.push(campoDetalle('schedule', evento.dia_completo ? 'Todo el día' : (evento.hora_inicio + ' – ' + evento.hora_fin)));
    if (evento.medico_nombre) filas.push(campoDetalle('stethoscope', evento.medico_nombre + ' · ' + evento.medico_especialidad));
    if (evento.comentario) {
      filas.push('<div class="bg-[#F6FBFF] border border-[#D6ECFF] rounded-lg p-3 flex flex-col gap-1">'
        + '<span class="text-xs font-semibold text-[#1D2D50] flex items-center gap-1.5"><span class="material-symbols-outlined text-[16px]">chat</span>Comentario del médico</span>'
        + '<span class="text-on-surface-variant">' + evento.comentario + '</span></div>');
    }
    document.getElementById('modal-cuerpo').innerHTML = filas.join('');

    const acciones = document.getElementById('modal-acciones');
    acciones.innerHTML = '';
    if (!evento.acciones.length) {
      const nota = document.createElement('p');
      nota.className = 'text-xs text-outline text-center';
      nota.textContent = evento.tipo === 'disponibilidad' ? 'Este horario está libre para agendar.' : 'No hay acciones disponibles para este evento.';
      acciones.appendChild(nota);
    } else {
      evento.acciones.forEach((accion) => {
        const enlace = document.createElement('a');
        enlace.href = accion.url;
        enlace.className = 'w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors bg-white border border-[#8EC5FF] text-[#236296] hover:bg-[#F6FBFF]';
        enlace.innerHTML = '<span class="material-symbols-outlined text-[18px]">' + accion.icono + '</span>' + accion.texto;
        acciones.appendChild(enlace);
      });
    }

    document.getElementById('modal-backdrop').classList.remove('hidden');
    document.getElementById('modal-card').classList.remove('hidden');
    requestAnimationFrame(() => {
      document.getElementById('modal-backdrop').classList.remove('opacity-0');
      document.getElementById('modal-card').classList.remove('opacity-0', 'scale-95');
    });
  }

  function cerrarDetalle() {
    document.getElementById('modal-backdrop').classList.add('opacity-0');
    document.getElementById('modal-card').classList.add('opacity-0', 'scale-95');
    setTimeout(() => {
      document.getElementById('modal-backdrop').classList.add('hidden');
      document.getElementById('modal-card').classList.add('hidden');
    }, 200);
  }

  document.querySelectorAll('.js-abrir-detalle').forEach((el) => {
    const activar = () => {
      const evento = eventos[el.dataset.eventoId];
      if (evento) abrirDetalle(evento);
    };
    el.addEventListener('click', activar);
    el.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') activar(); });
  });
  document.getElementById('modal-cerrar').addEventListener('click', cerrarDetalle);
  document.getElementById('modal-backdrop').addEventListener('click', cerrarDetalle);
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') cerrarDetalle(); });
})();
</script>

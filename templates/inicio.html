{% extends "base.html" %}

{% block title %}Inicio - MedSync{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop gap-stack-md">
<h1 class="font-headline-lg text-headline-lg text-primary">Bienvenido, {{ user.first_name|default:user.username }}</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Este es un placeholder del panel principal de MedSync.</p>
<form action="{% url 'logout' %}" method="post">
{% csrf_token %}
<button class="font-label-md text-label-md text-primary hover:underline" type="submit">Cerrar sesión</button>
</form>
</div>
{% endblock %}

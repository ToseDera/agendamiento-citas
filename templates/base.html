{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{% block title %}MedSync{% endblock %}</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#a9c7ff",
                        "secondary-fixed": "#7af6eb",
                        "surface-variant": "#d8e3fa",
                        "secondary": "#006a64",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface": "#f9f9ff",
                        "secondary-container": "#77f4e8",
                        "primary": "#00478d",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#dfe3e7",
                        "tertiary": "#43484c",
                        "surface-bright": "#f9f9ff",
                        "on-surface": "#111c2c",
                        "on-primary-fixed": "#001b3d",
                        "error": "#ba1a1a",
                        "tertiary-fixed-dim": "#c3c7cb",
                        "on-primary-container": "#c8daff",
                        "primary-container": "#005eb8",
                        "inverse-primary": "#a9c7ff",
                        "surface-container-high": "#dee8ff",
                        "surface-tint": "#005db6",
                        "on-error": "#ffffff",
                        "background": "#f9f9ff",
                        "on-surface-variant": "#424752",
                        "on-tertiary-container": "#d6dade",
                        "on-tertiary-fixed": "#171c1f",
                        "outline-variant": "#c2c6d4",
                        "inverse-surface": "#263142",
                        "surface-container": "#e7eeff",
                        "on-secondary-fixed": "#00201d",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed-variant": "#00504b",
                        "primary-fixed": "#d6e3ff",
                        "on-primary-fixed-variant": "#00468c",
                        "on-background": "#111c2c",
                        "surface-dim": "#cfdaf1",
                        "on-secondary": "#ffffff",
                        "outline": "#727783",
                        "surface-container-low": "#f0f3ff",
                        "surface-container-highest": "#d8e3fa",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#5b6063",
                        "secondary-fixed-dim": "#5adacf",
                        "on-tertiary-fixed-variant": "#43474b",
                        "on-secondary-container": "#006f68",
                        "inverse-on-surface": "#ebf1ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "stack-md": "16px",
                        "gutter": "24px",
                        "stack-sm": "8px",
                        "stack-lg": "32px",
                        "margin-mobile": "16px",
                        "margin-desktop": "40px",
                        "container-max": "1280px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
{% block extra_head %}{% endblock %}
</head>
<body class="bg-background text-on-background min-h-screen">
{% if messages %}
<div class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop pt-stack-md flex flex-col gap-stack-sm">
{% for message in messages %}
<div class="rounded-lg px-4 py-3 font-label-md text-label-md{% if message.tags == 'success' %} bg-secondary-container text-on-secondary-container{% elif message.tags == 'error' %} bg-error-container text-error{% elif message.tags == 'warning' %} bg-tertiary-container text-on-tertiary-container{% else %} bg-surface-container text-on-surface-variant{% endif %}">
{{ message }}
</div>
{% endfor %}
</div>
{% endif %}
{% block content %}{% endblock %}
</body>
</html>
